name: Recurring runtime sweep

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      require_auth:
        description: "Fail the run if the worker rejects ADMIN_TOKEN (401)"
        type: boolean
        default: false
      max_pages:
        description: "Max batches per lane while hasMore=true"
        type: string
        default: "5"

permissions: {}

concurrency:
  group: satoshi-runtime-sweep
  cancel-in-progress: false

env:
  WORKER_URL: https://satoshi-bitcoin-research.projectouroboroscollective.workers.dev

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      revision: ${{ steps.check.outputs.revision }}
    steps:
      - name: Check live worker health
        id: check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 --retry 3 --retry-delay 5 --retry-connrefused \
            "$WORKER_URL/health" -o health.json
          if ! jq -e '.ok == true and .mode == "live"' health.json >/dev/null; then
            echo "::error::Worker not ok/live: $(head -c 300 health.json)"
            exit 1
          fi
          rev="$(jq -r '.revision // "unknown"' health.json)"
          echo "revision=${rev}" >> "$GITHUB_OUTPUT"
          echo "worker healthy revision=${rev}"

  lanes:
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [commits, feeds, forum, mailinglist, releases, discovery]
    steps:
      - name: "Run lane: ${{ matrix.lane }}"
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          LANE: ${{ matrix.lane }}
          MAX_PAGES: ${{ inputs.max_pages || '5' }}
          REQUIRE_AUTH: ${{ inputs.require_auth || 'false' }}
        run: |
          set -uo pipefail

          summary() { echo "- **${LANE}**: $1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::warning::ADMIN_TOKEN is empty, lane ${LANE} skipped (worker cron covers it)"
            summary "skipped (no ADMIN_TOKEN)"
            [ "$REQUIRE_AUTH" = "true" ] && exit 1
            exit 0
          fi

          total=0
          more=false
          pages=0

          for page in $(seq 1 "$MAX_PAGES"); do
            status="$(curl -sS --max-time 90 --retry 2 --retry-delay 5 \
              -o out.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              "$WORKER_URL/run/${LANE}" || echo 000)"

            case "$status" in
              200) ;;
              401)
                echo "::warning::Lane ${LANE}: 401, ADMIN_TOKEN rejected"
                summary "401 unauthorized"
                [ "$REQUIRE_AUTH" = "true" ] && exit 1
                exit 0
                ;;
              *)
                echo "::error::Lane ${LANE}: HTTP ${status}"
                head -c 500 out.json 2>/dev/null || true
                summary "FAILED (HTTP ${status})"
                exit 1
                ;;
            esac

            pages=$page
            count="$(jq -r '.count // 0' out.json 2>/dev/null || echo 0)"
            more="$(jq -r '.hasMore // false' out.json 2>/dev/null || echo false)"
            total=$((total + count))
            echo "batch ${page}: count=${count} hasMore=${more}"

            [ "$more" = "true" ] || break
          done

          if [ "$more" = "true" ]; then
            echo "::warning::Lane ${LANE}: hasMore still true after ${MAX_PAGES} batches"
          fi
          summary "batches=${pages} count=${total} hasMore=${more}"

  analysis:
    needs: [health, lanes]
    if: ${{ !cancelled() && needs.health.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run analysis executor
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REQUIRE_AUTH: ${{ inputs.require_auth || 'false' }}
        run: |
          set -uo pipefail

          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "::warning::ADMIN_TOKEN is empty, analysis skipped (worker cron covers it)"
            [ "$REQUIRE_AUTH" = "true" ] && exit 1
            exit 0
          fi

          status="$(curl -sS --max-time 300 --retry 1 --retry-delay 10 \
            -o analysis.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            "$WORKER_URL/run/analysis-execute" || echo 000)"

          case "$status" in
            200)
              processed="$(jq -r '.processed // "n/a"' analysis.json 2>/dev/null || echo n/a)"
              results="$(jq -r '(.results // []) | length' analysis.json 2>/dev/null || echo n/a)"
              echo "## Analysis executor" >> "$GITHUB_STEP_SUMMARY"
              echo "- processed=${processed} results=${results}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            401)
              echo "::warning::Analysis executor: 401, ADMIN_TOKEN rejected"
              [ "$REQUIRE_AUTH" = "true" ] && exit 1
              ;;
            *)
              echo "::error::Analysis executor returned HTTP ${status}"
              head -c 500 analysis.json 2>/dev/null || true
              exit 1
              ;;
          esac
