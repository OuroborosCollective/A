name: Cloudflare Free Research Runtime

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".deploy/cloudflare-request.json"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the exact checked-out revision to Cloudflare"
        required: true
        default: false
        type: boolean
      activate_notion_writes:
        description: "After preview deploy, activate standard Notion API writes"
        required: true
        default: false
        type: boolean
      evidence_lane:
        description: "Controlled lane to execute after deployment"
        required: true
        default: commits
        type: choice
        options:
          - commits
          - forum

permissions:
  contents: read

concurrency:
  group: satoshi-cloudflare-runtime
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run verify

  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'deploy/')) }}
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bind deployment to checked-out revision
        shell: bash
        run: echo "DEPLOY_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm install --ignore-scripts
      - run: npm run verify

      - name: Resolve requested deployment mode and evidence lane
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const req = JSON.parse(fs.readFileSync('.deploy/cloudflare-request.json', 'utf8'));
          if (req.enabled !== true) throw new Error('deploy request is not enabled');
          if (!['preview', 'live'].includes(req.mode)) throw new Error('deploy request mode must be preview or live');
          const lane = req.evidence_lane ?? 'commits';
          if (!['commits', 'forum'].includes(lane)) throw new Error('evidence_lane must be commits or forum');
          if (req.base_sha !== process.env.PR_BASE_SHA) throw new Error(`deploy request base_sha ${req.base_sha} does not match PR base ${process.env.PR_BASE_SHA}`);
          process.stdout.write(`mode=${req.mode}\nlane=${lane}\n`);
          NODE
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const cp = require('child_process');
          const req = JSON.parse(fs.readFileSync('.deploy/cloudflare-request.json', 'utf8'));
          if (req.enabled !== true) throw new Error('deploy request is not enabled');
          if (!['preview', 'live'].includes(req.mode)) throw new Error('deploy request mode must be preview or live');
          const lane = req.evidence_lane ?? 'commits';
          if (!['commits', 'forum'].includes(lane)) throw new Error('evidence_lane must be commits or forum');
          const parent = cp.execSync('git rev-parse HEAD^', { encoding: 'utf8' }).trim();
          if (req.base_sha !== parent) throw new Error(`deploy request base_sha ${req.base_sha} does not match parent ${parent}`);
          process.stdout.write(`mode=${req.mode}\nlane=${lane}\n`);
          NODE
          else
            if [ "${{ inputs.activate_notion_writes }}" = "true" ]; then
              echo "mode=live" >> "$GITHUB_OUTPUT"
            else
              echo "mode=preview" >> "$GITHUB_OUTPUT"
            fi
            echo "lane=${{ inputs.evidence_lane }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed on Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 1; }

      - name: Resolve or create free D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.114.0 whoami >/dev/null
          DB_ID="$(npx wrangler@4.114.0 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(Array.isArray(x)?x:x.result||[]).find(v=>v.name==="satoshi-research");process.stdout.write(r?.uuid||r?.id||"")})')"
          if [ -z "$DB_ID" ]; then
            npx wrangler@4.114.0 d1 create satoshi-research
            DB_ID="$(npx wrangler@4.114.0 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(Array.isArray(x)?x:x.result||[]).find(v=>v.name==="satoshi-research");process.stdout.write(r?.uuid||r?.id||"")})')"
          fi
          test -n "$DB_ID" || { echo "Could not resolve D1 database id" >&2; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate revision-bound preview config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.template.jsonc','utf8');
          text = text.replace('__D1_DATABASE_ID__', process.env.D1_DATABASE_ID)
                     .replace('__AUTONOMY_MODE__', 'preview')
                     .replace('__REVISION__', process.env.DEPLOY_REVISION);
          fs.writeFileSync('wrangler.generated.jsonc', text);
          NODE

      - name: Apply D1 schema
        run: npx wrangler@4.114.0 d1 execute satoshi-research --remote --file=migrations/0001_init.sql --config wrangler.generated.jsonc

      - name: Deploy preview mode first
        run: npx wrangler@4.114.0 deploy --config wrangler.generated.jsonc

      - name: Generate ephemeral protected manual-run token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$TOKEN" | npx wrangler@4.114.0 secret put ADMIN_TOKEN --config wrangler.generated.jsonc

      - name: Install Notion secret without exposing it
        if: ${{ steps.request.outputs.mode == 'live' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOTION_API_TOKEN:-}" || { echo "NOTION_API_TOKEN missing" >&2; exit 1; }
          printf '%s' "$NOTION_API_TOKEN" | npx wrangler@4.114.0 secret put NOTION_API_TOKEN --config wrangler.generated.jsonc

      - name: Switch exact revision to live Notion writes
        if: ${{ steps.request.outputs.mode == 'live' }}
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.template.jsonc','utf8');
          text = text.replace('__D1_DATABASE_ID__', process.env.D1_DATABASE_ID)
                     .replace('__AUTONOMY_MODE__', 'live')
                     .replace('__REVISION__', process.env.DEPLOY_REVISION);
          fs.writeFileSync('wrangler.generated.jsonc', text);
          NODE
          npx wrangler@4.114.0 deploy --config wrangler.generated.jsonc

      - name: Resolve workers.dev URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(!x.success||!x.result?.subdomain)process.exit(2);process.stdout.write(x.result.subdomain)})')"
          URL="https://satoshi-bitcoin-research.${SUBDOMAIN}.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL resolved"

      - name: Read back worker health and exact revision
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          EXPECTED_MODE: ${{ steps.request.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f health.json
          MATCHED=0
          for i in $(seq 1 12); do
            if curl -fsS "$WORKER_URL/health" -o health.json; then
              cat health.json
              if node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('health.json','utf8'));
          if (x.ok !== true) process.exit(1);
          if (x.revision !== process.env.DEPLOY_REVISION) process.exit(1);
          if (x.mode !== process.env.EXPECTED_MODE) process.exit(1);
          NODE
              then
                MATCHED=1
                break
              fi
            fi
            sleep 5
          done
          test "$MATCHED" = "1" || { echo "Worker never converged to expected revision/mode" >&2; exit 1; }
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('health.json','utf8'));
          console.log(`health verified revision=${x.revision} mode=${x.mode}`);
          NODE

      - name: Run controlled evidence lane
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          EXPECTED_MODE: ${{ steps.request.outputs.mode }}
          EVIDENCE_LANE: ${{ steps.request.outputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f lane.json
          STATUS=""
          for i in $(seq 1 12); do
            STATUS="$(curl -sS -o lane.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${ADMIN_TOKEN}" "$WORKER_URL/run/${EVIDENCE_LANE}" || true)"
            if [ "$STATUS" = "200" ]; then break; fi
            if [ "$STATUS" = "401" ]; then sleep 5; continue; fi
            cat lane.json || true
            echo "Unexpected controlled-lane HTTP status: $STATUS" >&2
            exit 1
          done
          test "$STATUS" = "200" || { cat lane.json || true; echo "Controlled lane never observed propagated ADMIN_TOKEN" >&2; exit 1; }
          cat lane.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('lane.json','utf8'));
          if (x.lane !== process.env.EVIDENCE_LANE) throw new Error(`unexpected lane ${x.lane} != ${process.env.EVIDENCE_LANE}`);
          if (x.mode !== process.env.EXPECTED_MODE) throw new Error(`lane mode mismatch ${x.mode} != ${process.env.EXPECTED_MODE}`);
          if (!Number.isInteger(x.count) || x.count < 0) throw new Error('invalid count');
          console.log(`lane verified lane=${x.lane} count=${x.count} hasMore=${x.hasMore}`);
          NODE

      - name: Read back D1 schema and runtime receipts
        if: ${{ always() && steps.d1.outputs.database_id != '' }}
        run: |
          npx wrangler@4.114.0 d1 execute satoshi-research --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('sync_state','records','action_receipts','analysis_queue') ORDER BY name" --config wrangler.generated.jsonc
          npx wrangler@4.114.0 d1 execute satoshi-research --remote --command="SELECT lane, action, status, canonical_id, target, details, created_at FROM action_receipts ORDER BY created_at DESC LIMIT 60" --config wrangler.generated.jsonc
          npx wrangler@4.114.0 d1 execute satoshi-research --remote --command="SELECT kind, COUNT(*) AS records, SUM(CASE WHEN notion_page_id IS NOT NULL THEN 1 ELSE 0 END) AS notion_pages FROM records GROUP BY kind ORDER BY kind" --config wrangler.generated.jsonc
          npx wrangler@4.114.0 d1 execute satoshi-research --remote --command="SELECT executor, kind, status, requires_human_review, COUNT(*) AS tasks FROM analysis_queue GROUP BY executor, kind, status, requires_human_review ORDER BY executor, kind, status" --config wrangler.generated.jsonc
