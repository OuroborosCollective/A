name: Cloudflare Free Research Runtime

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".deploy/cloudflare-request.json"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the exact checked-out revision to Cloudflare"
        required: true
        default: false
        type: boolean
      activate_notion_writes:
        description: "After preview deploy, activate standard Notion API writes"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: satoshi-cloudflare-runtime
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run verify

  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run verify

      - name: Resolve requested deployment mode
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const cp = require('child_process');
          const req = JSON.parse(fs.readFileSync('.deploy/cloudflare-request.json', 'utf8'));
          if (req.enabled !== true) throw new Error('deploy request is not enabled');
          if (!['preview', 'live'].includes(req.mode)) throw new Error('deploy request mode must be preview or live');
          const parent = cp.execSync('git rev-parse HEAD^', { encoding: 'utf8' }).trim();
          if (req.base_sha !== parent) throw new Error(`deploy request base_sha ${req.base_sha} does not match parent ${parent}`);
          process.stdout.write(`mode=${req.mode}\n`);
          NODE
          else
            if [ "${{ inputs.activate_notion_writes }}" = "true" ]; then
              echo "mode=live" >> "$GITHUB_OUTPUT"
            else
              echo "mode=preview" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fail closed on Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 1; }

      - name: Resolve or create free D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.114.0 whoami >/dev/null
          DB_ID="$(npx wrangler@4.114.0 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(Array.isArray(x)?x:x.result||[]).find(v=>v.name==="satoshi-research");process.stdout.write(r?.uuid||r?.id||"")})')"
          if [ -z "$DB_ID" ]; then
            npx wrangler@4.114.0 d1 create satoshi-research
            DB_ID="$(npx wrangler@4.114.0 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(Array.isArray(x)?x:x.result||[]).find(v=>v.name==="satoshi-research");process.stdout.write(r?.uuid||r?.id||"")})')"
          fi
          test -n "$DB_ID" || { echo "Could not resolve D1 database id" >&2; exit 1; }
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Generate revision-bound preview config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.template.jsonc','utf8');
          text = text.replace('__D1_DATABASE_ID__', process.env.D1_DATABASE_ID)
                     .replace('__AUTONOMY_MODE__', 'preview')
                     .replace('__REVISION__', process.env.GITHUB_SHA);
          fs.writeFileSync('wrangler.generated.jsonc', text);
          NODE

      - name: Apply D1 schema
        run: npx wrangler@4.114.0 d1 execute satoshi-research --remote --file=migrations/0001_init.sql --config wrangler.generated.jsonc

      - name: Deploy preview mode first
        run: npx wrangler@4.114.0 deploy --config wrangler.generated.jsonc

      - name: Install Notion secret without exposing it
        if: ${{ steps.request.outputs.mode == 'live' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NOTION_API_TOKEN:-}" || { echo "NOTION_API_TOKEN missing" >&2; exit 1; }
          printf '%s' "$NOTION_API_TOKEN" | npx wrangler@4.114.0 secret put NOTION_API_TOKEN --config wrangler.generated.jsonc

      - name: Install optional protected manual-run token
        if: ${{ steps.request.outputs.mode == 'live' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            printf '%s' "$ADMIN_TOKEN" | npx wrangler@4.114.0 secret put ADMIN_TOKEN --config wrangler.generated.jsonc
          fi

      - name: Switch exact revision to live Notion writes
        if: ${{ steps.request.outputs.mode == 'live' }}
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let text = fs.readFileSync('wrangler.template.jsonc','utf8');
          text = text.replace('__D1_DATABASE_ID__', process.env.D1_DATABASE_ID)
                     .replace('__AUTONOMY_MODE__', 'live')
                     .replace('__REVISION__', process.env.GITHUB_SHA);
          fs.writeFileSync('wrangler.generated.jsonc', text);
          NODE
          npx wrangler@4.114.0 deploy --config wrangler.generated.jsonc

      - name: Read back D1 schema and receipt surface
        run: |
          npx wrangler@4.114.0 d1 execute satoshi-research --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('sync_state','records','action_receipts') ORDER BY name" --config wrangler.generated.jsonc
